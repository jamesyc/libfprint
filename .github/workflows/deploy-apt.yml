name: Deploy apt repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian package
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: ./scripts/install-build-deps.sh

      - name: Build and verify packages
        run: ./scripts/build-debs.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: .build/artifacts/
          if-no-files-found: error

  deploy:
    name: Publish GitHub Pages apt repo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: debian-packages
          path: .build/artifacts

      - name: Install apt repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Import apt signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-fingerprint

      - name: Generate signed apt repository
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: ./scripts/build-apt-repo.sh .build/artifacts public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
